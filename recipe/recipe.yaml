schema_version: 1

context:
  name: smoqe
  version: "0.1.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 836ada4f26d870188c513df86bc58ab58ba34ad82046131d02f72486d721240f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - pip
    - pymongo
    - docutils >=0.3

tests:
  - python:
      imports:
        - smoqe
      pip_check: true
      python_version: 
        - ${{ python_min }}
        - "*"

about:
  license: LGPL-3.0-only
  license_file: LICENSE
  summary: Simplified MongoDB Query Expressions
  description: |
    This module translates from a simple human-readable syntax into
    a MongoDB query. Currently it does no execution of the query
    -- use something like pymongo for that (as shown below).
  homepage: https://github.com/dangunter/smoqe
  repository: https://github.com/dangunter/smoqe
  documentation: https://github.com/dangunter/smoqe

extra:
  recipe-maintainers:
    - jan-janssen
